name: CraigScape autonomous heartbeat
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check eligibility without creating activity'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: craigscape-heartbeat
  cancel-in-progress: false
jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Validate scheduler configuration
        env:
          ENDPOINT: ${{ secrets.CRAIGSCAPE_SCHEDULER_URL }}
          TOKEN: ${{ secrets.CRAIGSCAPE_SCHEDULER_TOKEN }}
        run: |
          test -n "$ENDPOINT" || { echo "::error::Missing CRAIGSCAPE_SCHEDULER_URL"; exit 1; }
          test -n "$TOKEN" || { echo "::error::Missing CRAIGSCAPE_SCHEDULER_TOKEN"; exit 1; }
      - name: Wake CraigScape
        env:
          ENDPOINT: ${{ secrets.CRAIGSCAPE_SCHEDULER_URL }}
          TOKEN: ${{ secrets.CRAIGSCAPE_SCHEDULER_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          set -euo pipefail
          result=$(curl --fail-with-body --silent --show-error --max-time 110 \
            --request POST "$ENDPOINT" \
            --header 'Content-Type: application/json' \
            --header "Authorization: Bearer $TOKEN" \
            --data "{\"dryRun\":$DRY_RUN}")
          printf '%s\n' "$result" | python3 -c 'import sys,json; x=json.load(sys.stdin); print(json.dumps({k:x.get(k) for k in ("ok","dryRun","published","acted","reason","agent") if k in x})); sys.exit(0 if x.get("ok") is True else 1)'
